[tool.poetry]
name = "neopilot"
version = "0.1.1"
description = "NeoPilot python SDK"
authors = ["Md Sulaiman <dev.sulaiman@icloud.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://neopilot.ai"
repository = "https://github.com/neopilot-ai/neoai-ide/tree/main/NeoPilot/sdk-python"
keywords = ["copilot", "neopilot", "langgraph", "langchain", "ai", "langsmith", "langserve"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
langgraph = {version = ">=0.3.25,<1.1.0"}
langchain = {version = ">=0.3.0"}
crewai = { version = "0.118.0", optional = true }
ag-ui-langgraph = { version = "0.0.21", extras = ["readyapi"] }
readyapi = "^0.112.0"
partialjson = "^0.0.8"
toml = "^0.10.2"

[tool.poetry.extras]
crewai = ["crewai"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
